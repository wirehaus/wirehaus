[workspace]
resolver = "3"
members = ["crates/protocol", "crates/capture", "crates/crypto", "crates/crypto-wasm", "crates/encode", "crates/input", "crates/clipboard", "crates/audio", "crates/vault", "crates/agent"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.90"
license-file = "LICENSE"
publish = false
repository = "https://github.com/wirehaus/wirehaus"
homepage = "https://wirehaus.dev"
authors = ["Cristóbal Tormo <contact@wirehaus.dev>"]

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
thiserror = "2"
core-graphics = { version = "0.25", features = ["highsierra"] }
macos-accessibility-client = "0.0.1"
x11rb = "0.14"
enigo = { version = "0.6", default-features = false }
arboard = { version = "3", default-features = false }
dxgi-capture-rs = "1.2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
