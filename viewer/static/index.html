<html lang="es">

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="wirehaus-agent-address" content="own" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)" />
    <script src="/boot.js"></script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Wirehaus" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="robots" content="noindex" />
    <title>Wirehaus</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%232f81f7'/%3E%3Cpath d='M14.67 26.38 L22.14 44.08 Q23.5 47.3 24.86 44.07 L30.84 29.87 Q32 27.1 33.16 29.87 L39.14 44.07 Q40.5 47.3 41.86 44.08 L49.33 26.38' fill='none' stroke='%23fff' stroke-width='6.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='12.1' cy='20.3' r='5.2' fill='none' stroke='%23fff' stroke-width='3.4'/%3E%3Ccircle cx='51.9' cy='20.3' r='5.2' fill='none' stroke='%23fff' stroke-width='3.4'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/xterm.css" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/main.js"></script>
  </head>
  <body data-state="loading">
    <p id="boot-note" class="boot-note" hidden><span></span> <button type="button" hidden></button></p>

        <circle cx="51.9" cy="20.3" r="4.4" fill="none" stroke="currentColor" stroke-width="2.8" />

      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></symbol>

      <symbol id="i-file-text" viewBox="0 0 24 24"><path d="M7 3h7l5 5v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" /><path d="M14 3v5h5" /><path d="M9 13h6M9 17h6" /></symbol>
      <symbol id="i-file-plus" viewBox="0 0 24 24"><path d="M7 3h7l5 5v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" /><path d="M14 3v5h5" /><path d="M12.5 12v6M9.5 15h6" /></symbol>
      <symbol id="i-code" viewBox="0 0 24 24"><path d="M9 8l-4 4 4 4M15 8l4 4-4 4M13 6l-2 12" /></symbol>

      <symbol id="i-archive" viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="4.5" rx="1" /><path d="M5 8.5V19a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8.5M10 12.5h4" /></symbol>
      <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V6l10-2v12" /><circle cx="6.5" cy="18" r="2.5" /><circle cx="16.5" cy="16" r="2.5" /></symbol>
      <symbol id="i-film" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2" /><path d="M8 5v14M16 5v14M3.5 9.5H8M3.5 14.5H8M16 9.5h4.5M16 14.5h4.5" /></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.2" /><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.2" /><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.2" /><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.2" /></symbol>

      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19z" /><path d="M14.5 6.5l3 3" /></symbol>

      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></symbol>
      <symbol id="i-drive" viewBox="0 0 24 24"><rect x="3" y="13" width="18" height="7" rx="2" /><path d="M5 13l2.5-8h9L19 13M17 16.5h.01" /></symbol>
      <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4" /><path d="M7 10H6a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1" /></symbol>
      <symbol id="i-add-home" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3.5" /><path d="M12 8.5v7M8.5 12h7" /></symbol>
      <symbol id="i-app" viewBox="0 0 24 24"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5" /><path d="M10.5 18.5h3" /></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7M6 10v10h12V10" /></symbol>
      <symbol id="i-sort" viewBox="0 0 24 24"><path d="M7 5v14M3.5 15.5L7 19l3.5-3.5M17 19V5M13.5 8.5L17 5l3.5 3.5" /></symbol>
    </svg>

    <header id="top">
      <a class="brand" href="https://wirehaus.dev" rel="noopener" aria-label="Wirehaus">
        <svg class="mark" aria-hidden="true"><use href="#i-mark" /></svg>
        <span class="wordmark">Wirehaus</span>
      </a>
      <span id="agent" class="chip" hidden></span>
      <span class="state"><span id="dot" class="dot" aria-hidden="true"></span><span id="status" role="status"></span></span>
      <span id="tools-notice" role="status"></span>
      <span id="tools" class="tools" hidden>
        <button id="shot" type="button" class="tool"></button>
        <button id="record" type="button" class="tool"></button>
        <button id="listen" type="button" class="tool"></button>
        <span class="monitor-wrap" id="monitor-wrap" hidden>
          <button id="monitor" type="button" class="tool" aria-haspopup="true" aria-expanded="false"></button>
          <div id="monitor-menu" class="menu monitor-menu" role="menu" hidden></div>
        </span>
      </span>
      <button id="reconnect" type="button" class="primary small" hidden></button>
      <div class="menu-wrap">
        <button id="menu-button" type="button" class="icon" aria-haspopup="true" aria-expanded="false" hidden>
          <svg aria-hidden="true"><use href="#i-dots" /></svg>
        </button>
        <div id="menu" class="menu" hidden>
          <label class="menu-field">
            <span id="lang-label"></span>
            <select id="lang">
              <option value="es">Español</option>
              <option value="en">English</option>
            </select>
          </label>
          <label class="menu-field" id="layout-field">
            <span id="layout-label"></span>
            <select id="layout">
              <option value="es">Español</option>
              <option value="us">English (US)</option>
            </select>
          </label>
          <button id="link-open" type="button" class="menu-item" hidden></button>
          <button id="install-app" type="button" class="menu-item" hidden></button>
          <button id="immersive" type="button" class="menu-item"></button>
          <button id="forget" type="button" class="menu-item danger"></button>
        </div>
      </div>
    </header>

    <main>
      <section id="home" class="stage" hidden>
        <form id="home-form" class="card" autocomplete="off" novalidate>
          <div class="card-head">
            <svg class="logo" aria-hidden="true"><use href="#i-mark" /></svg>
          </div>
          <h1 id="home-title"></h1>
          <p id="home-lead" class="lead"></p>
          <p id="home-app-note" class="note" hidden></p>
          <label class="field">
            <span id="home-label"></span>
            <span class="affix">
              <input id="home-name" name="name" class="mono-lower" inputmode="url" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="32" enterkeyhint="go" />
              <span class="suffix">.wirehaus.dev</span>
            </span>
          </label>
          <p id="home-error" class="error" role="alert"></p>
          <button id="home-submit" type="submit" class="primary"></button>
          <button id="home-continue" type="button" class="ghost wide" hidden></button>
          <div id="home-recent" class="recent" hidden>
            <p id="home-recent-title" class="hint"></p>
            <div id="home-recent-list" class="recent-list"></div>
          </div>
          <p class="split"><span id="home-noaccess"></span> <a id="home-create" class="inline" rel="noopener"></a></p>
        </form>
      </section>

      <section id="pair" class="stage" hidden>
        <form id="pair-form" class="card" autocomplete="off">
          <div class="card-head">
            <svg class="logo" aria-hidden="true"><use href="#i-mark" /></svg>
            <ol class="steps" aria-hidden="true">
              <li class="on" id="step-pair"><span>1</span><em id="step-pair-label"></em></li>
              <li id="step-verify"><span>2</span><em id="step-verify-label"></em></li>
            </ol>
          </div>
          <h1 id="pair-title"></h1>
          <p id="pair-intro" class="lead"></p>
          <label class="field">
            <span id="pair-code-label"></span>
            <span class="affix">
              <input id="pair-code" name="code" aria-labelledby="pair-code-label" class="mono" required autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="next" />
              <button id="pair-scan" type="button" class="scan-button" aria-expanded="false"><svg aria-hidden="true"><use href="#i-camera" /></svg></button>
            </span>
          </label>
          <div id="pair-scanbox" class="scanbox" hidden><video id="pair-video" muted playsinline></video></div>
          <p id="pair-hint" class="hint"></p>
          <label class="field">
            <span id="pair-name-label"></span>
            <input id="pair-name" name="name" required maxlength="64" autocomplete="off" enterkeyhint="go" />
          </label>
          <p id="pair-error" class="error" role="alert"></p>
          <button id="pair-submit" type="submit" class="primary"></button>
          <div id="link-offer" class="link-offer" hidden>
            <p class="or"><span id="link-or"></span></p>
            <button id="link-start" type="button" class="ghost wide"></button>
          </div>
          <p class="secure"><svg aria-hidden="true"><use href="#i-lock" /></svg><span id="secure-pair"></span></p>
        </form>
      </section>

      <section id="linkpc" class="stage" hidden>
        <div class="card">
          <div class="card-head">
            <svg class="logo" aria-hidden="true"><use href="#i-mark" /></svg>
          </div>
          <h1 id="linkpc-title"></h1>
          <p id="linkpc-intro" class="lead"></p>
          <div class="qrbox"><canvas id="linkpc-qr" width="1" height="1"></canvas></div>
          <div class="linkcopy" id="linkpc-copybox" hidden>
            <input id="linkpc-link" readonly spellcheck="false" aria-label="Link" />
            <button id="linkpc-copy" type="button" class="ghost"></button>
          </div>
          <dl class="linkcodes">
            <div><dt id="linkpc-manual-label"></dt><dd id="linkpc-manual" class="mono"></dd></div>
            <div><dt id="linkpc-verify-label"></dt><dd id="linkpc-verify" class="mono"></dd></div>
          </dl>
          <label class="check"><input id="linkpc-remember" type="checkbox" checked /><span id="linkpc-remember-label"></span></label>
          <p id="linkpc-status" class="hint" role="status"></p>
          <p id="linkpc-error" class="error" role="alert"></p>
          <button id="linkpc-retry" type="button" class="primary" hidden></button>
          <button id="linkpc-cancel" type="button" class="ghost wide"></button>
        </div>
      </section>

      <section id="code" class="stage" hidden>
        <form id="code-form" class="card" autocomplete="off">
          <div class="card-head">
            <svg class="logo" aria-hidden="true"><use href="#i-mark" /></svg>
            <ol class="steps" aria-hidden="true">
              <li class="done" id="step-pair-done"><span>1</span><em id="step-pair-done-label"></em></li>
              <li class="on"><span>2</span><em id="step-verify-on-label"></em></li>
            </ol>
          </div>
          <h1 id="code-title"></h1>
          <p id="code-hint" class="lead"></p>
          <label class="field">
            <span id="code-label"></span>
            <input
              id="code-input"
              name="otp"
              class="otp"
              inputmode="numeric"
              pattern="[0-9]{6}"
              maxlength="6"
              autocomplete="one-time-code"
              enterkeyhint="go"
              placeholder="000000"
              required
            />
          </label>
          <label class="check"><input id="code-remember" type="checkbox" checked /><span id="code-remember-label"></span></label>
          <p id="code-error" class="error" role="alert"></p>
          <button id="code-submit" type="submit" class="primary"></button>
          <p class="secure"><svg aria-hidden="true"><use href="#i-lock" /></svg><span id="secure-code"></span></p>
        </form>
      </section>

      <div id="reconnect-banner" class="reconnect-banner" role="status" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <span id="reconnect-text"></span>
      </div>

      <section id="splash" class="stage" hidden>
        <div class="card splash">
          <div id="splash-spinner" class="spinner" aria-hidden="true"></div>
          <svg id="splash-icon" class="splash-icon" aria-hidden="true" hidden><use href="#i-alert" /></svg>
          <h1 id="splash-title"></h1>
          <p id="splash-detail" class="lead"></p>
          <div class="splash-actions">
            <a id="splash-reserve" class="primary linkbtn" rel="noopener" hidden></a>
            <button id="splash-other" type="button" class="ghost" hidden></button>
            <button id="splash-reconnect" type="button" class="primary" hidden></button>
            <button id="splash-forget" type="button" class="ghost" hidden></button>
          </div>
        </div>
      </section>

      <dialog id="link-dialog" class="sheet" aria-labelledby="link-title">
        <div class="card">
          <h1 id="link-title"></h1>
          <div id="link-step-find">
            <p id="link-intro" class="lead"></p>
            <div id="link-scanbox" class="scanbox" hidden><video id="link-video" muted playsinline></video></div>
            <button id="link-scan" type="button" class="primary"></button>
            <label class="field">
              <span id="link-manual-label"></span>
              <input id="link-manual" class="mono" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="200" enterkeyhint="go" />
            </label>
            <button id="link-find" type="button" class="ghost wide"></button>
          </div>
          <div id="link-step-confirm" hidden>
            <p id="link-verify-text" class="lead"></p>
            <p id="link-verification" class="verification mono" aria-live="polite"></p>
            <label class="field">
              <span id="link-code-label"></span>
              <input id="link-code" class="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="000000" />
            </label>
            <p id="link-code-hint" class="hint"></p>
            <button id="link-approve" type="button" class="primary"></button>
          </div>
          <div id="link-step-done" hidden>
            <p id="link-done" class="lead"></p>
          </div>
          <p id="link-error" class="error" role="alert"></p>
          <button id="link-close" type="button" class="ghost wide"></button>
        </div>
      </dialog>

      <footer id="foot" class="foot" hidden>
        <a id="foot-docs" rel="noopener"></a>
        <a id="foot-privacy" rel="noopener"></a>
        <a id="foot-terms" rel="noopener"></a>
      </footer>

      <div id="screen-area" class="screen-area" hidden>
        <canvas id="screen" tabindex="0" hidden></canvas>
        <button type="button" id="zoom-reset" class="overlay" hidden aria-label="Fit"><svg aria-hidden="true"><use href="#i-fit" /></svg></button>
      </div>
      <div id="terminals" hidden></div>
      <div id="files" hidden></div>
      <div id="clipboard" hidden></div>
    </main>

    <div id="keys" class="keys" hidden>
      <button type="button" id="keyboard" class="accent"><svg aria-hidden="true"><use href="#i-keyboard" /></svg><span id="keyboard-label"></span></button>
      <div class="keys-row">
        <button type="button" data-key="Escape">Esc</button>
        <button type="button" data-key="Tab">Tab</button>
        <button type="button" data-mod="Control" aria-pressed="false">Ctrl</button>
        <button type="button" data-mod="Alt" aria-pressed="false">Alt</button>
        <button type="button" data-mod="Shift" aria-pressed="false">Shift</button>
        <button type="button" data-mod="Meta" aria-pressed="false">Win</button>
        <button type="button" data-key="ArrowLeft" class="sq" aria-label="Left"><svg aria-hidden="true"><use href="#i-left" /></svg></button>
        <button type="button" data-key="ArrowUp" class="sq" aria-label="Up"><svg aria-hidden="true"><use href="#i-up" /></svg></button>
        <button type="button" data-key="ArrowDown" class="sq" aria-label="Down"><svg aria-hidden="true"><use href="#i-down" /></svg></button>
        <button type="button" data-key="ArrowRight" class="sq" aria-label="Right"><svg aria-hidden="true"><use href="#i-right" /></svg></button>
        <button type="button" data-key="PageUp">PgUp</button>
        <button type="button" data-key="PageDown">PgDn</button>
        <button type="button" data-key="Delete">Supr</button>
      </div>
    </div>
    <textarea id="softkeys" class="softkeys" aria-label="Keyboard" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" tabindex="-1"></textarea>
    <nav id="tabs" aria-label="Tabs" hidden></nav>
    <div id="update-banner" class="update-banner" role="status" hidden><span id="update-text"></span><button type="button" id="update-reload" class="accent"></button><button type="button" id="update-later"></button></div>
    <dialog id="install-dialog" class="sheet bottom" aria-labelledby="install-title">
      <div class="card">
        <span class="install-mark" aria-hidden="true"><svg><use href="#i-app" /></svg></span>
        <h1 id="install-title" tabindex="-1"></h1>
        <p id="install-lead" class="lead"></p>
        <ol id="install-steps" class="install-steps" role="list" hidden></ol>
        <p id="install-session" class="hint" hidden></p>
        <button id="install-go" type="button" class="primary" hidden></button>
        <button id="install-browser" type="button" class="ghost wide" hidden></button>
        <button id="install-later" type="button" class="ghost wide"></button>
        <button id="install-never" type="button" class="linkish"></button>
      </div>
    </dialog>
    <div id="capture-hint" class="capture-hint" role="status" hidden></div>
    <button id="immersive-exit" type="button" class="floating icon" hidden><svg aria-hidden="true"><use href="#i-collapse" /></svg></button>
  </body>
</html>
