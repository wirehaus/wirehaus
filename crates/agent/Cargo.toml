[package]
name = "wirehaus-agent"
description = "Wirehaus agent for the machine you want to reach"
default-run = "wirehaus-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file = "../../LICENSE"
publish.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lib]
name = "wirehaus_agent"
path = "src/lib.rs"

[[bin]]
name = "wirehaus-agent"
path = "src/main.rs"

[[bin]]
name = "wirehaus-agentd"
path = "src/bin/wirehaus-agentd.rs"

[dependencies]
clap.workspace = true
ed25519-dalek = { version = "2", default-features = false }
httparse = "1"
qrcode = { version = "0.14", default-features = false }
portable-pty = "0.9"
sha2 = "0.10"
thiserror.workspace = true
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
wirehaus-audio = { path = "../audio" }
wirehaus-capture = { path = "../capture" }
wirehaus-clipboard = { path = "../clipboard" }
wirehaus-crypto = { path = "../crypto" }
wirehaus-encode = { path = "../encode", features = ["h264"] }
wirehaus-input = { path = "../input" }
wirehaus-protocol = { path = "../protocol" }
wirehaus-vault = { path = "../vault" }

[dev-dependencies]
openh264 = "0.9"

[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb.workspace = true

[lints]
workspace = true
