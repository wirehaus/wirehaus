[package]
name = "wirehaus-agent"
description = "Wirehaus agent for the machine you want to reach"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file = "../../LICENSE"
publish.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "wirehaus_agent"
path = "src/lib.rs"

[[bin]]
name = "wirehaus-agent"
path = "src/main.rs"

[dependencies]
clap.workspace = true
httparse = "1"
thiserror.workspace = true
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
wirehaus-capture = { path = "../capture" }
wirehaus-crypto = { path = "../crypto" }
wirehaus-encode = { path = "../encode" }
wirehaus-input = { path = "../input" }
wirehaus-protocol = { path = "../protocol" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb.workspace = true

[lints]
workspace = true
