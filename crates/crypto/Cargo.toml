[package]
name = "wirehaus-crypto"
description = "Handshake, pairing and second factor for Wirehaus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file = "../../LICENSE"
publish.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
blake2 = "0.11"
getrandom = "0.4"
hmac = "0.13"
snow = { version = "0.10", default-features = false, features = ["default-resolver", "use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom"] }
sha1 = "0.11"
subtle = "2"
thiserror.workspace = true
zeroize = "1"

[lints]
workspace = true
