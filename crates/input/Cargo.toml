[package]
name = "wirehaus-input"
description = "Keyboard and mouse injection for the Wirehaus agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file = "../../LICENSE"
publish.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
thiserror.workspace = true
wirehaus-protocol = { path = "../protocol" }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { workspace = true, features = ["xtest", "randr"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = { workspace = true, features = ["randr"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics.workspace = true
macos-accessibility-client.workspace = true

[target.'cfg(windows)'.dependencies]
enigo.workspace = true

[lints]
workspace = true
