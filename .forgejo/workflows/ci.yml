name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "43 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: cargo fmt --all --check

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup toolchain install 1.90.0 --profile minimal
      - run: cargo +1.90.0 check --workspace --all-targets --locked

  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.ref_type == 'branch' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: cargo test --workspace --locked

  viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup target add wasm32-unknown-unknown
        working-directory: .
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
        working-directory: .
      - run: npm ci
      - run: npm run build
      - run: |
          echo "Viewer bundle hash: $(cat dist/manifest.sha256 | sha256sum | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
          (cd dist && sha256sum --check --quiet manifest.sha256)
      - run: npm test
